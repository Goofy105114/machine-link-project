version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: machinelink_db
    restart: always
    environment:
      MYSQL_DATABASE: machinelink
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: machinelink_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: machinelink
      DB_PORT: 3306
      JWT_SECRET: machinelink_secret_jwt_key_2026
      PORT: 5000
      NODE_ENV: development
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: machinelink_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  mysql_data:
